services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: mg-phase4-test-root-only
      MYSQL_DATABASE: mg_drill_fixture
      MYSQL_USER: moneygestor_ops
      MYSQL_PASSWORD: mg-phase4-test-only
    volumes:
      - ./grant-test-privileges.sql:/docker-entrypoint-initdb.d/99-test-privileges.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 2s
      timeout: 2s
      retries: 45

  tools:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      MYSQL_PWD: mg-phase4-test-root-only
    volumes:
      - ../../../:/workspace:ro
    working_dir: /workspace

  app-init:
    image: mcr.microsoft.com/dotnet/aspnet:8.0
    depends_on:
      mysql:
        condition: service_healthy
    working_dir: /app
    command: ["dotnet", "webserver.dll"]
    environment: &app-env
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      BACKEND_APP_SETTINGS: /run/moneygestor.recovery-test.json
      DATA_PROTECTION_KEYS_PATH: /tmp/moneygestor-test-keys
      database__host: mysql
      database__port: "3306"
      database__name: mg_drill_fixture
      database__user: moneygestor_ops
      database__password: mg-phase4-test-only
      database__bootstrapMode: Migrate
    volumes: &app-volumes
      - ../../../backend/webserver/bin/Debug/net8.0:/app:ro
      - ./moneygestor.recovery-test.json:/run/moneygestor.recovery-test.json:ro

  app-source:
    image: mcr.microsoft.com/dotnet/aspnet:8.0
    depends_on:
      mysql:
        condition: service_healthy
    working_dir: /app
    command: ["dotnet", "webserver.dll"]
    environment:
      <<: *app-env
      database__bootstrapMode: Disabled
    volumes: *app-volumes
    ports:
      - "127.0.0.1::8080"

  app-stage:
    image: mcr.microsoft.com/dotnet/aspnet:8.0
    depends_on:
      mysql:
        condition: service_healthy
    working_dir: /app
    command: ["dotnet", "webserver.dll"]
    environment:
      <<: *app-env
      database__name: mg_restore_bak43test
      database__bootstrapMode: Disabled
    volumes: *app-volumes
    ports:
      - "127.0.0.1::8080"
