name: API contract and application

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.400
      - run: dotnet restore backend/backend.sln --locked-mode
      - run: dotnet build backend/backend.sln --configuration Release --no-restore
      - run: dotnet test backend/TestProject/TestProject.csproj --configuration Release --no-build
      - name: Verify versioned OpenAPI snapshots
        shell: bash
        env:
          ASPNETCORE_ENVIRONMENT: Testing
        run: |
          dotnet run --project backend/webserver/webserver.csproj --configuration Release --no-build --no-launch-profile -- --export-openapi docs/openapi
          git diff --exit-code -- docs/openapi

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
