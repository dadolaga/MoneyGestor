services:
  backend:
    image: ${BACKEND_IMAGE:-moneygestor/backend:local}
    build:
      context: ./backend
      dockerfile: webserver/Dockerfile
    container_name: moneygestor-backend
    init: true
    restart: unless-stopped
    read_only: true
    ports:
      - "${BACKEND_BIND_ADDRESS:-127.0.0.1}:${BACKEND_PORT:-5000}:8080"
    volumes:
      - type: bind
        source: ./settings.json
        target: /app/settings.json
        read_only: true
      - type: volume
        source: backend-logs
        target: /app/log
      - type: volume
        source: backend-data-protection
        target: /app/data-protection-keys
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      DOTNET_RUNNING_IN_CONTAINER: "true"
      BACKEND_APP_SETTINGS: /app/settings.json
      DATA_PROTECTION_KEYS_PATH: /app/data-protection-keys
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 128
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    networks:
      - moneygestor-network
    extra_hosts:
      - "host.docker.internal:host-gateway"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:${BACKEND_PORT:-5000}
    container_name: moneygestor-frontend
    init: true
    restart: unless-stopped
    ports:
      - "${FRONTEND_BIND_ADDRESS:-127.0.0.1}:${FRONTEND_PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - moneygestor-network
    environment:
      NODE_ENV: production
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

volumes:
  backend-logs:
  backend-data-protection:

networks:
  moneygestor-network:
    driver: bridge
